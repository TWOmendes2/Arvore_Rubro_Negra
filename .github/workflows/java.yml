name: Java tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: javac -encoding UTF-8 -d out src/tree/domain/RedBlackTree.java RedBlackTreeVisualizer.java tests/TreeTest.java
      - run: java -cp out TreeTest
